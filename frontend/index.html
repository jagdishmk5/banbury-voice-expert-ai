<!DOCTYPE html>
<html>
<head>
<title>Banbury Voice Expert AI</title>

<style>
body{
font-family:Arial;
background:#f4f7fa;
text-align:center;
padding:20px;
}

.card{
background:white;
max-width:800px;
margin:auto;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px #ccc;
}

button{
padding:10px 15px;
margin:5px;
background:#0078d4;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

input{
width:80%;
padding:10px;
margin:10px;
}

#answer{
background:#eef6ff;
padding:15px;
border-radius:10px;
margin-top:20px;
white-space:pre-line;
text-align:left;
}
</style>

</head>

<body>

<div class="card">

<h1>🎤 Banbury Voice Expert AI</h1>

<p>Compound Hold Analysis & Tyre Impact Expert</p>

<h3>🌐 Language</h3>

<button onclick="setLanguage('hi')">Hindi</button>
 
<button onclick="setLanguage('en')">English</button>
 
<button onclick="setLanguage('mr')">Marathi</button>
 
<button onclick="setLanguage('te')">Telugu</button>
 
<button onclick="setLanguage('ta')">Tamil</button>

<hr>

<h3>⌨️ Type Question</h3>

<input
type="text"
id="question"
placeholder="Example : compound hard">

<br>

<button onclick="analyzeBanbury()">
Analyze
</button>

<hr>

<h3>🎤 Voice Question</h3>

<button onclick="startVoice()">
Start Voice
</button>

<p id="result">
Speak something...
</p>

<hr>

<h3>📄 Upload Lab Report</h3>

<input type="file">

<hr>

<h2>🤖 AI Result</h2>

<div id="answer">
Ask a Banbury Question
</div>

</div>
  
<script src="./dictionary.js"></script>
<script src="./knowledge.js"></script>
<script src="./engine.js"></script>
<script src="./translations.js"></script>
  
<script>

 let currentLanguage = "en";
 
function setLanguage(lang){
 
currentLanguage = lang;
 
document.getElementById("result").innerHTML =
"Selected Language : " + lang;
 
}

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition =
new SpeechRecognition();

recognition.lang = "hi-IN";

recognition.start();

recognition.onresult = function(event){

let text =
event.results[0][0].transcript;

document.getElementById("result").innerHTML =
text;

document.getElementById("question").value =
text;

analyzeBanbury();

  speakAnswer();

};

}
  
function analyzeBanbury(){

let question =
document.getElementById("question").value;

let answer =
getBanburyAnswer(question);

  console.log(currentLanguage);
console.log(translations[currentLanguage]);

  alert(currentLanguage);

if(
currentLanguage !== "en" &&
translations[currentLanguage]
){

answer =
answer.replaceAll(
"PROBLEM",
translations[currentLanguage].problem
);

answer =
answer.replaceAll(
"CONFIDENCE",
translations[currentLanguage].confidence
);

}

document.getElementById("answer").innerHTML =
answer;

}
  
function speakAnswer(){

let text =
document.getElementById("answer").innerText;

if(!text) return;

window.speechSynthesis.cancel();

let speech =
new SpeechSynthesisUtterance(text);

if(currentLanguage === "hi"){
speech.lang = "hi-IN";
}

if(currentLanguage === "en"){
speech.lang = "en-US";
}

if(currentLanguage === "mr"){
speech.lang = "mr-IN";
}

if(currentLanguage === "te"){
speech.lang = "te-IN";
}

if(currentLanguage === "ta"){
speech.lang = "ta-IN";
}
  
speech.rate = 1;
speech.pitch = 1;
speech.volume = 1;

window.speechSynthesis.speak(speech);

}

</script>


</body>
</html>
