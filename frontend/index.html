<!DOCTYPE html>
<html>
<head>
  <title>Banbury Voice Expert AI</title>

  <style>
    body{
      font-family:Arial;
      background:#f4f7fa;
      text-align:center;
      margin:0;
      padding:20px;
    }

    .card{
      background:white;
      max-width:700px;
      margin:auto;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 10px #ccc;
    }

    button{
      padding:10px 15px;
      margin:5px;
      border:none;
      background:#0078d4;
      color:white;
      border-radius:8px;
    }

    h1{
      color:#0078d4;
    }

    .section{
      margin-top:20px;
    }
  </style>

</head>

<body>

<div class="card">

<h1>🎤 TEST 999 FRONTEND</h1>

<p>Compound Hold Analysis & Tyre Impact Expert</p>

<div class="section">
<h2>🌐 Language</h2>

<button>Hindi</button>
<button>English</button>
<button>Marathi</button>
<button>Telugu</button>
<button>Tamil</button>
</div>

<div class="section">
<h2>🎤 Voice Question</h2>
<button>Start Voice</button>
</div>

<div class="section">
<h2>📄 Upload Lab Report</h2>
<input type="file">
</div>

<div class="section">
<h2>🤖 AI Analysis</h2>

<p>Compound Hold Reason</p>
<p>Raw Material Cause</p>
<p>Process Cause</p>
<p>Machine Cause</p>
<p>Tyre Impact</p>
<p>Corrective Action</p>

</div>

</div>

</body>
</html>
