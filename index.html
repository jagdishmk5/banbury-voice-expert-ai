<!DOCTYPE html>
<html>
<head>
<title>Banbury Voice Expert AI Pro</title>

<style>

body{
font-family:Arial;
background:#f4f7fa;
padding:20px;
text-align:center;
}

.card{
background:white;
padding:20px;
border-radius:15px;
max-width:900px;
margin:auto;
box-shadow:0px 0px 10px #ccc;
}

button{
padding:10px;
margin:5px;
background:#0078d4;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

input{
padding:10px;
width:80%;
margin:10px;
}

#answer{
margin-top:20px;
padding:15px;
background:#eef6ff;
border-radius:8px;
white-space:pre-line;
text-align:left;
}

</style>

</head>

<body>

<div class="card">

<h1>🎤 Banbury Voice Expert AI Pro</h1>

<h3>🌐 Select Language</h3>

<button>Hindi</button>
<button>English</button>
<button>Marathi</button>
<button>Telugu</button>
<button>Tamil</button>

<hr>

<h3>⌨️ Type Question</h3>

<input
type="text"
id="question"
placeholder="Example : Compound hard hai">

<br>

<button onclick="analyzeBanbury()">
Analyze
</button>

<hr>

<h3>🎤 Voice Question</h3>

<button onclick="startVoice()">
Start Voice
</button>

<p id="result">
Speak something...
</p>

<hr>

<h3>📄 Upload Lab Report</h3>

<input type="file">

<hr>

<h2>🤖 AI Result</h2>

<div id="answer">
Ask a Banbury Question
</div>

</div>

<script>

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition =
new SpeechRecognition();

recognition.lang = "hi-IN";

recognition.start();

recognition.onresult = function(event){

let text =
event.results[0][0].transcript;

document.getElementById("result").innerHTML = text;

document.getElementById("question").value = text;

/* Auto Analyze */
analyzeBanbury();

/* Auto Speak */
setTimeout(function(){
speakAnswer();
},500);

};

}

function analyzeBanbury(){

let question =
document.getElementById("question").value;

let answer =
getBanburyAnswer(question);

document.getElementById("answer").innerHTML =
answer;

}

function speakAnswer(){

let text =
document.getElementById("answer").innerText;

if(text.trim() === "") return;

window.speechSynthesis.cancel();

let speech =
new SpeechSynthesisUtterance(text);

speech.lang = "en-IN";
speech.rate = 1;
speech.pitch = 1;

window.speechSynthesis.speak(speech);

}

</script>

<script src="knowledge.js"></script>
<script src="engine.js"></script>

</body>
</html>
